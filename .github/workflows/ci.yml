name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aucun dump de jeu dans le dépôt
        run: "! git ls-files | grep -iE '\\.(z64|n64|v64|gb|gbc|srm|sav|state)$'"
      - name: Syntaxe
        run: node --check web/app.js && node --check tools/serveur.mjs
      - name: Test de fumée
        run: node tests/smoke.mjs

  # Si tout passe sur main, le dossier web/ est publié sur GitHub Pages
  publier:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
